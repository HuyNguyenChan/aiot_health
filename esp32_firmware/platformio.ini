[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32
; PlatformIO không có board id tên đúng "ESP32S3 Dev Module" như Arduino IDE.
; Cấu hình gần nhất và ổn định nhất là esp32-s3-devkitc-1.
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Giữ cấu hình board sát với profile mặc định của esp32-s3-devkitc-1 / ESP32S3 Dev Module:
; - 8MB flash
; - không ép PSRAM
; - không ép memory_type OPI
; - ưu tiên upload/monitor qua USB-to-UART bridge như CH343 trên board thực tế

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    milesburton/DallasTemperature@^4.0.4
    paulstoffregen/OneWire@^2.3.8
    electroniccats/MPU6050@^1.4.3
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=4096

; Không ép USB CDC on boot trong firmware.
; Điều này giúp hành vi gần với cách dùng ESP32S3 Dev Module qua cổng USB-UART
; trong Arduino IDE, và tránh khác biệt không cần thiết giữa hai môi trường.

; Env mặc định dùng cho firmware chính của dự án.
; Chỉ build main.cpp để tránh đụng setup()/loop() với các file test riêng.
build_src_filter =
    +<main.cpp>
    -<test_max30102.cpp>
    -<test_ds18b20.cpp>
    -<test_mpu6050.cpp>
    -<test_ad8232.cpp>

[env:max30102_test]
extends = env:esp32s3_n16r8

; Env này dành riêng cho bài test MAX30102.
; Khi chọn env này, PlatformIO chỉ build file test_max30102.cpp.
build_src_filter =
    +<test_max30102.cpp>
    -<main.cpp>
    -<test_ds18b20.cpp>
    -<test_mpu6050.cpp>
    -<test_ad8232.cpp>

[env:ds18b20_test]
extends = env:esp32s3_n16r8

; Env này dành riêng cho bài test DS18B20.
; Khi chọn env này, PlatformIO chỉ build file test_ds18b20.cpp.
build_src_filter =
    +<test_ds18b20.cpp>
    -<main.cpp>
    -<test_max30102.cpp>
    -<test_mpu6050.cpp>
    -<test_ad8232.cpp>

[env:mpu6050_test]
extends = env:esp32s3_n16r8

; Env này dành riêng cho bài test MPU6050.
; Khi chọn env này, PlatformIO chỉ build file test_mpu6050.cpp.
build_src_filter =
    +<test_mpu6050.cpp>
    -<main.cpp>
    -<test_max30102.cpp>
    -<test_ds18b20.cpp>
    -<test_ad8232.cpp>

[env:ad8232_test]
extends = env:esp32s3_n16r8

; Env này dành riêng cho bài test AD8232.
; OUTPUT dùng GPIO1 (ADC1_CH0 trên ESP32-S3), LO+=GPIO11, LO-=GPIO12.
; Chỉ dùng ADC1 cho tín hiệu ECG, không dùng ADC2 khi WiFi bật.
build_src_filter =
    +<test_ad8232.cpp>
    -<main.cpp>
    -<test_max30102.cpp>
    -<test_ds18b20.cpp>
    -<test_mpu6050.cpp>
